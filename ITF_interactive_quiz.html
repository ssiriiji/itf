<script>
const BANK=[{"week":8,"title":"Database","questions":[{"n":1,"prompt":"Information (สารสนเทศ) คือข้อใด","opts":{"A":"ข้อมูลดิบที่ยังไม่ผ่านการประมวลผล","B":"กลุ่มข้อมูลที่จัดเก็บอย่างเป็นระบบ","C":"ข้อมูลที่ผ่านการประมวลผลแล้ว มีระเบียบ มีความหมาย และนำไปใช้ได้","D":"ซอฟต์แวร์ที่ใช้จัดการข้อมูล","E":"ที่เก็บข้อมูลบน hard drive"},"answer":"C"},{"n":2,"prompt":"ข้อใด ไม่ใช่ หน้าที่ของ DBMS","opts":{"A":"สร้างฐานข้อมูล","B":"เพิ่ม แก้ไข ลบข้อมูล","C":"เรียงลำดับและค้นคืนข้อมูล","D":"สร้างฟอร์มและรายงาน","E":"ผลิตฮาร์ดแวร์สำหรับจัดเก็บข้อมูล"},"answer":"E"},{"n":3,"prompt":"ลำดับชั้นของข้อมูลจาก ใหญ่ไปเล็ก คือข้อใด","opts":{"A":"Database → Record → Data file → Field → Character","B":"Database → Data file → Record → Field → Character","C":"Data file → Database → Record → Character → Field","D":"Database → Field → Record → Data file → Character","E":"Character → Field → Record → Data file → Database"},"answer":"B"},{"n":4,"prompt":"หน่วยข้อมูลที่ เล็กที่สุดที่ผู้ใช้เข้าถึงได้ คือข้อใด","opts":{"A":"Bit","B":"Character","C":"Record","D":"Field","E":"Data file"},"answer":"D"},{"n":5,"prompt":"ใน ASCII 1 ตัวอักษร (character) ใช้กี่ bits","opts":{"A":"1 bit","B":"4 bits","C":"8 bits","D":"16 bits","E":"32 bits"},"answer":"C"},{"n":6,"prompt":"Primary key คือ field ที่ทำหน้าที่ใด","opts":{"A":"ระบุ record แต่ละอันได้ไม่ซ้ำกัน","B":"เก็บข้อความยาว","C":"ตรวจสอบรูปแบบอีเมล","D":"กำหนดสิทธิ์ผู้ใช้","E":"เก็บชื่อของไฟล์ ส่วนที่ 2: Data Types"},"answer":"A"},{"n":7,"prompt":"Data type ที่ DBMS กำหนดเลขไม่ซ้ำให้อัตโนมัติ เช่น Student ID คือ","opts":{"A":"Number","B":"AutoNumber","C":"Currency","D":"Text","E":"Date/Time"},"answer":"B"},{"n":8,"prompt":"ข้อความยาว เช่น หมายเหตุหรือรายละเอียดเพิ่มเติม ควรใช้ data type ใด","opts":{"A":"Number","B":"Currency","C":"Date/Time","D":"Hyperlink","E":"Memo (Long text)"},"answer":"E"},{"n":9,"prompt":"อีเมลหรือเว็บแอดเดรสที่คลิกเปิดได้ ควรใช้ data type ใด","opts":{"A":"Text","B":"Memo","C":"AutoNumber","D":"Hyperlink","E":"Currency"},"answer":"D"},{"n":10,"prompt":"จำนวนเงินหรือตัวเลขที่มีทศนิยม ควรใช้ data type ใด","opts":{"A":"Currency","B":"Memo","C":"Hyperlink","D":"AutoNumber","E":"Text ส่วนที่ 3: File Maintenance และ Validation"},"answer":"A"},{"n":11,"prompt":"File maintenance หมายถึงข้อใด","opts":{"A":"การสำรองข้อมูลทุกคืน","B":"การเข้ารหัสไฟล์","C":"การเพิ่ม แก้ไข ลบ record เพื่อให้ข้อมูลเป็นปัจจุบัน","D":"การออกแบบรายงาน","E":"การติดตั้ง DBMS"},"answer":"C"},{"n":12,"prompt":"ถ้า field Last Name ที่จำเป็นต้องกรอก ถูกเว้นว่างไว้ แล้วระบบไม่ยอมรับ แสดงว่าใช้การตรวจสอบ แบบใด","opts":{"A":"Range check","B":"Completeness check","C":"Numeric check","D":"Alphabetic check","E":"Check digit"},"answer":"B"},{"n":13,"prompt":"นักเรียนมีวันเกิดหลังวันที่เข้าเรียน ระบบจึงแจ้งว่าไม่สมเหตุสมผล เป็นการตรวจแบบใด","opts":{"A":"Alphabetic check","B":"Numeric check","C":"Range check","D":"Completeness check","E":"Consistency check"},"answer":"E"},{"n":14,"prompt":"ค่า Ka24n ในช่องชื่อที่ต้องเป็นตัวอักษรเท่านั้น จะไม่ผ่านการตรวจแบบใด","opts":{"A":"Alphabetic check","B":"Range check","C":"Completeness check","D":"Consistency check","E":"Check digit"},"answer":"A"},{"n":15,"prompt":"ค่า s8q ในช่องที่ต้องเป็นตัวเลขเท่านั้น จะไม่ผ่านการตรวจแบบใด","opts":{"A":"Alphabetic check","B":"Completeness check","C":"Consistency check","D":"Numeric check","E":"Range check"},"answer":"D"},{"n":16,"prompt":"ช่องกำหนดค่าได้ไม่เกิน $1,000 แต่ผู้ใช้กรอก $2,120.00 ระบบไม่ผ่าน เป็นการตรวจแบบใด","opts":{"A":"Alphabetic check","B":"Numeric check","C":"Range check","D":"Completeness check","E":"Consistency check"},"answer":"C"},{"n":17,"prompt":"Check digit คืออะไร","opts":{"A":"ตัวอักษรที่นำหน้าชื่อ field","B":"เลขหรืออักขระที่ต่อท้ายค่า primary key เพื่อใช้ตรวจความถูกต้อง","C":"ค่าที่บอกว่า field ว่างหรือไม่","D":"ช่วงค่าที่ field ยอมรับได้","E":"รหัสผ่านของผู้ดูแลฐานข้อมูล"},"answer":"B"},{"n":18,"prompt":"อีเมล egearth.net ไม่มีเครื่องหมาย @ จึงถูกปฏิเสธ จัดเป็นการตรวจแบบใดในสไลด์","opts":{"A":"Alphabetic check","B":"Numeric check","C": let questions=[],idx=0,answers={},showingResult=false;
const $=id=>document.getElementById(id);
function load(){questions=(weekSel.value==='all'?BANK:BANK.filter(w=>w.week==weekSel.value)).flatMap(w=>w.questions.map(q=>({...q,week:w.week,title:w.title})));idx=0;answers={};showingResult=false;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function score(){return questions.reduce((n,q,i)=>n+(answers[i]===q.answer?1:0),0)}
function render(){if(!questions.length)return;let q=questions[idx],chosen=answers[idx];$('weekTitle').textContent=`Week ${q.week}: ${q.title}`;$('qCount').textContent=`${idx+1} / ${questions.length}`;$('qnum').textContent=`ข้อ ${q.n}`;$('prompt').textContent=q.prompt;$('options').innerHTML='';letters.forEach(L=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${L}.</span><span></span>`;b.querySelector('span:last-child').textContent=q.opts[L]||'';if(chosen){b.disabled=true;if(L===q.answer)b.classList.add('correct');if(L===chosen&&chosen!==q.answer)b.classList.add('wrong')}b.onclick=()=>select(L);$('options').appendChild(b)});let f=$('feedback');if(chosen){f.className='feedback '+(chosen===q.answer?'good':'bad');f.textContent=chosen===q.answer?`✓ ถูกต้อง! เฉลย ${q.answer}. ${q.opts[q.answer]}`:`✗ ยังไม่ถูก เฉลยคือ ${q.answer}. ${q.opts[q.answer]}`}else{f.className='hidden';f.textContent=''}$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'ดูคะแนน':'ข้อต่อไป';$('progressText').textContent=`ข้อ ${idx+1} จาก ${questions.length}`;$('scoreText').textContent=`คะแนน ${score()} / ${Object.keys(answers).length} ที่ตอบแล้ว`;$('bar').style.width=`${(idx+1)/questions.length*100}%`}
function select(L){if(answers[idx])return;answers[idx]=L;render()}
$('prev').onclick=()=>{if(idx>0){idx--;render()}};
$('next').onclick=()=>{if(idx<questions.length-1){idx++;render()}else result()};
function result(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let s=score(),done=Object.keys(answers).length;$('resultTitle').textContent=`คะแนน ${s} / ${questions.length}`;$('resultDetail').textContent=`ตอบแล้ว ${done} ข้อ • ยังไม่ได้ตอบ ${questions.length-done} ข้อ • คิดเป็น ${Math.round(s/questions.length*100)}%`;showingResult=true}
$('showScore').onclick=result;$('backQuiz').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('restart').onclick=load;weekSel.onchange=load;load();
</script></body></html>
